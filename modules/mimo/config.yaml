# MiMo 模块统一配置文件
# 所有常量和默认值集中管理

# ══════════════════════════════════════════
#  平台信息
# ══════════════════════════════════════════
platform:
  name: "mimo"
  display_name: "MiMo"

# ══════════════════════════════════════════
#  默认设备配置
# ══════════════════════════════════════════
device:
  # 默认设备标识
  default_device_id: "wb_MIQUERY000001"

  # 默认 User-Agent（登录、OTP 验证、查询共用）
  default_ua: "Mozilla/5.0 (iPhone; CPU iPhone OS 18_7 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Mobile/15E148"

# ══════════════════════════════════════════
#  默认消息模板
# ══════════════════════════════════════════
template:
  default: |-
    {label}
    ────────────────
      余额        {balance}元
      赠送        {gift_balance}元
      输入        {input_token}
      输出        {output_token}
      缓存        {cache_token}
      本月费用    {monthly_cost}元
      累计费用    {total_cost}元
