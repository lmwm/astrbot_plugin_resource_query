# JMComic 下载参数（jmcomic 原生 option 配置文件）
#
# 由插件按 Views「JM 下载 → 下载参数」表单生成并维护；表单保存会重写下面这些键，
# 手工添加的其它配置（plugins、client.domain 等）会保留。
# 默认值可用 Scripts/gen_option.py 重新生成。
log: true
dir_rule:
  rule: Bd/JP{Pindex:03}-{Pid}
  base_dir: JMDownload
  normalize_zh: zh-cn
download:
  cache: true
  image:
    decode: true
    suffix: null
  threading:
    image: 10
    photo: 2
client:
  impl: api
  retry_times: 3
  timeout: 20
