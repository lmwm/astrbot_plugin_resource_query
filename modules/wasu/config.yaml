# 华数广电模块统一配置文件
# 所有常量和默认值集中管理

# ══════════════════════════════════════════
#  平台信息
# ══════════════════════════════════════════
platform:
  name: "wasu"
  display_name: "华数广电"
  icon: "📺"

# ══════════════════════════════════════════
#  API 地址
# ══════════════════════════════════════════
api:
  base_url: "https://ups.wasu.cn"

# ══════════════════════════════════════════
#  默认请求头
# ══════════════════════════════════════════
headers:
  user_agent: "Mozilla/5.0 (Linux; Android 16; 23127PN0CC Build/BP2A.250605.031.A3; wv) "

# ══════════════════════════════════════════
#  超时设置（秒）
# ══════════════════════════════════════════
timeout:
  query: 10

# ══════════════════════════════════════════
#  默认消息模板
# ══════════════════════════════════════════
template:
  default: |-
    📺 {label}
    ────────────────
    💰 账户余额: {balance}
       当月话费: {month_fee}
       欠费: {arrears}

    📶 本月累计使用: {total_used}
       总流量: {total} | 已用: {used} | 剩余: {remain}

    🕐 查询时间: {query_time}
