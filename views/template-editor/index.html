<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>资源查询插件管理</title>
  <!-- 新版 AstrBot 会自动注入 bridge SDK；显式引入用于兼容旧版 -->
  <script src="/api/plugin/page/bridge-sdk.js"></script>
  <script src="js/base.js" defer></script>
  <script src="js/render.js" defer></script>
  <script src="js/account.js" defer></script>
  <script src="js/template.js" defer></script>
  <script src="js/main.js" defer></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <div class="container">
      <div class="header">
        <div class="header-title">
          <div class="header-icon">▤</div>
          <span>资源查询插件</span>
          <span class="version" id="version"></span>
        </div>
        <button class="btn btn-secondary btn-sm" data-action="reload">↻ 刷新</button>
      </div>

      <div class="nav-tabs" id="nav-tabs"></div>
      <div id="boot-error"></div>
      <div id="pages"></div>
    </div>
  </div>

  <!-- 账号编辑模态框 -->
  <div class="modal-overlay" id="account-modal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title" id="account-modal-title">编辑账号</div>
        <button class="btn btn-ghost" data-action="close-account-modal" aria-label="关闭">✕</button>
      </div>
      <div class="modal-body">
        <div class="status-box" id="account-status" style="display:none"></div>
        <div class="sub-tabs" id="account-tabs"></div>

        <div id="account-pane-config">
          <div id="account-form"></div>
          <div class="form-group" id="account-otp-row" style="display:none">
            <label class="form-label" for="account-otp">短信验证码</label>
            <input class="form-input" id="account-otp" placeholder="请输入收到的验证码" autocomplete="one-time-code">
          </div>
        </div>

        <div id="account-pane-template" style="display:none">
          <div class="template-header">
            <label class="form-label" style="margin-bottom:0">消息模板</label>
            <button class="btn btn-ghost btn-sm" data-action="reset-template">↺ 恢复默认</button>
          </div>
          <div class="template-layout">
            <div class="template-editor">
              <div class="template-label">模板编辑</div>
              <textarea class="form-textarea" id="account-template" spellcheck="false"></textarea>
            </div>
            <div class="template-preview-box">
              <div class="template-label">预览效果</div>
              <div class="template-preview" id="account-template-preview"></div>
            </div>
          </div>
          <div class="variable-tags" id="account-variable-tags"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-action="close-account-modal">取消</button>
        <button class="btn btn-secondary" id="btn-login" data-action="login-account" style="display:none">登录</button>
        <button class="btn btn-secondary" id="btn-test" data-action="test-account" style="display:none">测试</button>
        <button class="btn btn-primary" data-action="save-account">保存</button>
      </div>
    </div>
  </div>

  <!-- 删除确认 -->
  <div class="modal-overlay" id="delete-modal">
    <div class="modal" style="max-width:420px">
      <div class="modal-header">
        <div class="modal-title">确认删除</div>
      </div>
      <div class="modal-body">
        <p style="font-size:14px">确定要删除账号「<span id="delete-target"></span>」吗？此操作不可撤销。</p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-action="close-delete-modal">取消</button>
        <button class="btn btn-danger" data-action="confirm-delete">删除</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
