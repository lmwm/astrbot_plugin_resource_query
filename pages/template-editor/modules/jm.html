<!-- JM 设置页面 -->
<div class="page" id="page-jm">
  <div class="card">
    <div class="card-header">
      <div class="card-title">🎮 JMComic 下载配置</div>
      <button class="btn btn-primary btn-sm" onclick="saveJmConfig()">💾 保存配置</button>
    </div>
    <div class="card-body">
      <div style="max-width: 700px;">
        <!-- 基本设置 -->
        <div style="margin-bottom: 24px;">
          <div style="font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 14px; padding-bottom: 8px; border-bottom: 1px solid var(--border);">基本设置</div>
          <div class="form-row" style="margin-bottom: 14px;">
            <div class="form-group" style="margin-bottom:0">
              <label class="form-label" style="display:flex;align-items:center;gap:8px;">
                <input type="checkbox" id="jm-enabled" checked style="width:auto;">
                启用 JM 下载功能
              </label>
              <div style="font-size:11px;color:var(--text-muted);margin-top:4px;">关闭后 /jm 命令将不可用</div>
            </div>
            <div class="form-group" style="margin-bottom:0">
              <label class="form-label" style="display:flex;align-items:center;gap:8px;">
                <input type="checkbox" id="jm-send-file" checked style="width:auto;">
                下载后发送 PDF 文件
              </label>
              <div style="font-size:11px;color:var(--text-muted);margin-top:4px;">关闭后只显示结果提示，不发送文件</div>
            </div>
            <div class="form-group" style="margin-bottom:0">
              <label class="form-label">文件大小限制（MB）</label>
              <input class="form-input" id="jm-max-file-size" type="number" min="0" max="50" value="10" style="max-width: 150px;">
              <div style="font-size:11px;color:var(--text-muted);margin-top:4px;">超过此大小不发送文件，0 表示不限制</div>
            </div>
          </div>
        </div>

        <!-- 网络设置 -->
        <div style="margin-bottom: 24px;">
          <div style="font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 14px; padding-bottom: 8px; border-bottom: 1px solid var(--border);">网络设置</div>
          <div class="form-group">
            <label class="form-label">JMComic Cookie</label>
            <input class="form-input" id="jm-cookies" placeholder="如：csrf=xxx; remember_web=xxx" style="font-family:monospace;font-size:12px;">
            <div style="font-size:11px;color:var(--text-muted);margin-top:4px;">可选，格式为 k=v; k2=v2，用于访问仅登录可见内容</div>
          </div>
          <div class="form-group">
            <label class="form-label">代理地址</label>
            <input class="form-input" id="jm-proxy" placeholder="如：http://127.0.0.1:7890">
            <div style="font-size:11px;color:var(--text-muted);margin-top:4px;">可选，留空使用系统代理</div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">请求超时（秒）</label>
              <input class="form-input" id="jm-timeout" type="number" min="5" max="120" value="20">
              <div style="font-size:11px;color:var(--text-muted);margin-top:4px;">单次网络请求超时，范围 5-120</div>
            </div>
            <div class="form-group">
              <label class="form-label">重试次数</label>
              <input class="form-input" id="jm-retry-times" type="number" min="1" max="10" value="3">
              <div style="font-size:11px;color:var(--text-muted);margin-top:4px;">网络请求失败重试次数，范围 1-10</div>
            </div>
          </div>
        </div>

        <!-- 下载设置 -->
        <div style="margin-bottom: 16px;">
          <div style="font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 14px; padding-bottom: 8px; border-bottom: 1px solid var(--border);">下载设置</div>
          <div class="form-row" style="margin-bottom: 14px;">
            <div class="form-group">
              <label class="form-label">图片下载并发数</label>
              <input class="form-input" id="jm-image-threads" type="number" min="1" max="32" value="16">
              <div style="font-size:11px;color:var(--text-muted);margin-top:4px;">单章节内图片并行下载数，范围 1-32</div>
            </div>
            <div class="form-group">
              <label class="form-label">章节下载并发数</label>
              <input class="form-input" id="jm-photo-threads" type="number" min="1" max="16" value="4">
              <div style="font-size:11px;color:var(--text-muted);margin-top:4px;">章节并行下载数，范围 1-16</div>
            </div>
          </div>
          <div class="form-group" style="max-width: 340px;">
            <label class="form-label">同时下载数量</label>
            <input class="form-input" id="jm-max-concurrent" type="number" min="1" max="3" value="1">
            <div style="font-size:11px;color:var(--text-muted);margin-top:4px;">同时处理的漫画数量，范围 1-3</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
