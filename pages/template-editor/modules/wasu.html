<!-- 华数账号管理页面 -->
<div class="page" id="page-wasu">
  <!-- 子标签页 -->
  <div class="sub-tabs">
    <button class="sub-tab active" onclick="switchSubPage('wasu', 'accounts', event)">📋 账号管理</button>
    <button class="sub-tab" onclick="switchSubPage('wasu', 'variables', event)">⚙️ 变量配置</button>
  </div>

  <!-- 华数账号管理 -->
  <div class="sub-page active" id="wasu-accounts">
    <div class="card">
      <div class="card-header">
        <div class="card-title">📺 华数广电账号管理</div>
        <div style="display:flex;align-items:center;gap:12px">
          <span style="font-size:12px;color:var(--text-muted)"><span id="wasu-count">0</span> 个账号</span>
          <button class="btn btn-primary btn-sm" onclick="openAddWasuModal()">＋ 添加华数账号</button>
        </div>
      </div>
      <div class="card-body">
        <div class="account-grid" id="wasu-account-list"></div>
      </div>
    </div>
  </div>

  <!-- 华数变量配置 -->
  <div class="sub-page" id="wasu-variables">
    <div class="card">
      <div class="card-header">
        <div class="card-title">⚙️ 华数变量配置</div>
        <button class="btn btn-primary btn-sm" onclick="saveWasuVarConfig()">💾 保存配置</button>
      </div>
      <div class="card-body">
        <div id="wasu-var-list"></div>
      </div>
    </div>
  </div>
</div>

<!-- 华数账号添加/编辑模态框 -->
<div class="modal-overlay" id="wasu-modal">
  <div class="modal" style="max-width: 700px;">
    <div class="modal-header">
      <div class="modal-title" id="wasu-modal-title">添加华数账号</div>
      <button class="btn btn-ghost" onclick="closeWasuModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <div class="platform-tabs">
          <div class="platform-tab active" data-section="account" onclick="switchWasuModalSection('account')">📋 账号配置</div>
          <div class="platform-tab" data-section="template" onclick="switchWasuModalSection('template')">📝 消息模板</div>
        </div>
      </div>
      <div id="wasu-account-section">
        <div class="form-group">
          <label class="form-label">账号名称（可选）</label>
          <input class="form-input" id="wasu-field-name" placeholder="如：我的华数账号">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">手机号 *</label>
            <input class="form-input" id="wasu-field-phone" placeholder="手机号">
          </div>
          <div class="form-group">
            <label class="form-label">User Key *</label>
            <input class="form-input" id="wasu-field-user-key" placeholder="User Key">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Token *</label>
            <input class="form-input" id="wasu-field-token" placeholder="Token">
          </div>
          <div class="form-group">
            <label class="form-label">Sign</label>
            <input class="form-input" id="wasu-field-sign" placeholder="Sign（可选）">
          </div>
        </div>
      </div>
      <div id="wasu-template-section" style="display: none;">
        <div class="form-group">
          <div class="template-header">
            <label class="form-label" style="margin-bottom:0">消息模板</label>
            <button class="btn btn-ghost btn-sm" onclick="resetWasuTemplate()">↺ 恢复默认</button>
          </div>
          <div class="template-layout">
            <div class="template-editor">
              <div class="template-label">模板编辑</div>
              <textarea class="form-textarea" id="wasu-field-template" oninput="syncWasuPreviewHeight()" style="min-height: 300px;"></textarea>
            </div>
            <div class="template-preview-box">
              <div class="template-label">预览效果</div>
              <div class="template-preview" id="wasu-template-preview" style="min-height: 300px;"></div>
            </div>
          </div>
          <div class="variable-tags" id="wasu-variable-tags"></div>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeWasuModal()">取消</button>
      <button class="btn btn-primary" onclick="saveWasuAccount()">💾 保存</button>
    </div>
  </div>
</div>
